name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude Code review
    # A fork or Dependabot pull request is not handed CLAUDE_CODE_OAUTH_TOKEN,
    # so the action could only fail there. Skipped rather than left red.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # The action exchanges this OIDC token for a Claude GitHub App token,
      # which is what posts the review comments; GITHUB_TOKEN stays read-only.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # A prompt of our own rather than the code-review plugin: the plugin
      # audits CLAUDE.md only, and the conventions a change is held to here live
      # in the skill that owns it, which AGENTS.md's Skills table names.
      - uses: anthropics/claude-code-action@0a8d3c9443bbff909ab973b6a17a340b913f229f # v1.0.221
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The pull request is already checked out in
            the working directory; read its diff with `gh pr diff` and its title
            and description with `gh pr view`.

            1. Read AGENTS.md. It is the project guide every change is held to.
            2. From the "Skills" table in AGENTS.md, pick every skill whose
               subject covers a file this pull request changes, and read its
               `.claude/skills/<name>/SKILL.md`, plus any file under that skill's
               `references/` the SKILL.md points to for the kind of change made.
            3. Look for exactly two kinds of issue in the changed lines:
               - a bug: code that will behave wrongly, fail, or break a contract
                 AGENTS.md names;
               - a violation of a rule stated in AGENTS.md or in a skill picked
                 in step 2, where you can quote the rule and name its file.
            4. Before reporting an issue, confirm it against the code. Drop
               anything you cannot confirm, anything formatting, ESLint, the type
               checker or the test suite already catches, style preferences, and
               problems in lines this pull request does not touch.
            5. Post each confirmed issue as an inline comment with
               `mcp__github_inline_comment__create_inline_comment` (with
               `confirmed: true`), on the changed line it concerns. For a rule
               violation, quote the rule and name the file it comes from.
            6. Finish with one top-level `gh pr comment` that lists the skills
               you applied and the number of issues posted, or states
               "No issues found." followed by the skills you applied.

            Write every comment in English.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
